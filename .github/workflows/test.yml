name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        if: ${{ hashFiles('pyproject.toml') != '' }}
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Verify bootstrap
        run: test -f LICENSE
      - name: Install Qt system libraries
        if: ${{ hashFiles('pyproject.toml') != '' }}
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install application
        if: ${{ hashFiles('pyproject.toml') != '' }}
        run: python -m pip install -e '.[gui]'
      - name: Tests and shell checks
        if: ${{ hashFiles('pyproject.toml') != '' }}
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./test.sh
      - name: Full GUI construction
        if: ${{ hashFiles('pyproject.toml') != '' }}
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c 'from pathlib import Path; from tempfile import TemporaryDirectory; from PySide6.QtWidgets import QApplication; from recurring_report_pipeline.gui import MainWindow; app=QApplication([]); temp=TemporaryDirectory(); window=MainWindow(Path(temp.name)); assert window.windowTitle(); window.close()'
      - name: End-to-end demo
        if: ${{ hashFiles('pyproject.toml') != '' }}
        run: |
          tmp="$(mktemp -d)"
          python -m recurring_report_pipeline.cli --data-dir "$tmp" demo > "$tmp/result.json"
          python -c 'import json,sys; value=json.load(open(sys.argv[1])); assert value["row_count"] == 2 and len(value["files"]) == 3' "$tmp/result.json"
      - name: Public privacy boundary
        if: ${{ hashFiles('pyproject.toml') != '' }}
        run: |
          if rg -n --hidden --glob '!.git/**' --glob '!SUPPORT.md' --glob '!.github/FUNDING.yml' --glob '!.github/workflows/test.yml' 'BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|password\s*[:=]\s*[^ ]+|/home/[^ /]+|/Users/[^ /]+' .; then
            echo 'privacy scan found a prohibited pattern' >&2
            exit 1
          fi
