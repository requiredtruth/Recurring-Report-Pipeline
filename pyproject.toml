[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "recurring-report-pipeline"
version = "0.1.0"
description = "Local-first recurring CSV report jobs with quality gates and durable evidence"
requires-python = ">=3.11"
dependencies = []
license = {text = "MIT"}

[project.optional-dependencies]
gui = ["PySide6>=6.7,<7"]

[project.scripts]
report-pipeline = "recurring_report_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
